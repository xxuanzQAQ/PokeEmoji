[project]
name = "pokeemoji"
# 与 PokeEmoji/version.py 的 PokeEmoji_version 保持一致，发版时递增并打 tag
version = "1.2.0"
description = "戳一戳回复一张表情包，优先随机表情接口，本地图片目录兜底。"
authors = [{name = "xxuanzQAQ"}]
dependencies = [
    "httpx>=0.23.0",
    "pillow>=10.2.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/xxuanzQAQ/PokeEmoji"
Issues = "https://github.com/xxuanzQAQ/PokeEmoji/issues"
EmojiData = "https://emoji.wuwa.games/"

[tool.pdm]
distribution = false
