[project]
name = "pokeemoji"
# 与 PokeEmoji/version.py 的 PokeEmoji_version 保持一致，发版时递增并打 tag
version = "1.0.0"
description = "戳一戳回复一张表情包，数据来自 api.random-emoji.wuwa.games 接口。"
authors = [{name = "xxuanzQAQ"}]
dependencies = [
    "httpx>=0.23.0",
    "msgspec>=0.13.1",
    "pillow>=10.2.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/xxuanzQAQ/PokeEmoji"
Source = "https://emoji.wuwa.games/"

[tool.pdm]
distribution = false
